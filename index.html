<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polygon Slice</title>
<style>
:root{--ink:#10213d;--muted:#687995;--panel:#fff;--line:#dbe6f5;--accent:#5f76ff;--good:#22a96f;--bad:#ef5c6c;--yellow:#ffe45c}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:ui-rounded,"Pretendard","Noto Sans KR",system-ui,sans-serif;background:#eef6ff;color:var(--ink)}body{overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:1000;font-size:clamp(20px,4vw,30px)}.pill{background:#fff;border:1px solid #e2eaf6;border-radius:999px;padding:8px 12px;font-weight:900;box-shadow:0 8px 24px rgba(67,91,145,.12)}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:10px}.game{position:relative;min-height:0;overflow:hidden;border-radius:24px;border:1px solid #dfe8f6;background:#dff2ff;box-shadow:0 16px 44px rgba(67,91,145,.14)}canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.hudBox{background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid rgba(220,231,246,.9);border-radius:14px;padding:8px 11px;font-weight:900;box-shadow:0 6px 20px rgba(43,72,125,.1)}.mission{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(15,31,58,.88);color:#fff;border-radius:999px;padding:9px 14px;font-weight:900;font-size:14px;pointer-events:none;white-space:nowrap}
.toast{position:absolute;left:50%;bottom:74px;transform:translate(-50%,12px);opacity:0;background:#10213d;color:#fff;border-radius:999px;padding:10px 15px;font-weight:1000;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.side{background:#fff;border:1px solid #dfe8f6;border-radius:24px;padding:16px;overflow:auto;box-shadow:0 16px 44px rgba(67,91,145,.12);display:flex;flex-direction:column;gap:12px}.title{font-size:18px;font-weight:1000}.small{font-size:13px;line-height:1.5;color:var(--muted)}.card{border:1px solid #e3ebf6;background:#f8fbff;border-radius:17px;padding:13px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.row strong{font-weight:1000}.triRow{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.triDot{width:26px;height:22px;clip-path:polygon(50% 0,100% 100%,0 100%);background:#dce6fb}.triDot.on{background:#6f83ff}.answer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}input,button{font:inherit}input{width:100%;min-width:0;padding:12px;border:1px solid #d8e3f2;border-radius:12px;font-size:17px;outline:none}button{border:0;border-radius:12px;padding:11px 13px;background:var(--accent);color:#fff;font-weight:1000;cursor:pointer}button.ghost{background:#eef2ff;color:#495ca9}.formula{text-align:center;font-size:22px;font-weight:1000;background:#fff;border:1px dashed #b9c7ed;border-radius:13px;padding:11px}.bar{height:10px;border-radius:999px;background:#e7edf7;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;width:0;background:#6c7cff;transition:.25s}.levelBtns{display:flex;gap:6px;flex-wrap:wrap}.levelBtns button{font-size:13px;padding:8px 10px;background:#edf1ff;color:#4a5cab}.levelBtns button.active{background:#5f76ff;color:white}
@media(max-width:860px){body{overflow:auto}.app{height:auto;min-height:100%}.main{grid-template-columns:1fr;grid-template-rows:minmax(65vh,72vh) auto}.game{min-height:65vh}.side{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">⚡ POLYGON SLICE</div><div class="pill">점수 <span id="score">0</span> · 콤보 <span id="combo">0</span></div></div>
  <div class="main">
    <section class="game" id="gameWrap">
      <canvas id="game"></canvas>
      <div class="hud"><div class="hudBox">🔺 <span id="triHud">1 / 3</span></div><div class="hudBox">⬇️ 바닥 전에 완성!</div></div>
      <div class="mission" id="mission">노란 꼭짓점에서 쓱 베어 보세요!</div>
      <div class="toast" id="toast"></div>
    </section>
    <aside class="side">
      <div><div class="title">다각형 슬라이스 미션</div><div class="small">노란 꼭짓점을 기준으로 대각선 방향을 쓱 베어 삼각형으로 나누세요. 끝점은 정확하지 않아도 자동 보정됩니다.</div></div>
      <div class="card"><div class="row"><span>현재 도형</span><strong id="polyName">오각형</strong></div><div class="row"><span>필요한 삼각형</span><strong id="triNeed">3개</strong></div><div class="row"><span>성공한 슬라이스</span><strong id="sliceVal">0 / 2</strong></div><div class="triRow" id="triRow"></div></div>
      <div class="card"><strong>규칙 발견 게이지</strong><div class="bar"><i id="bar"></i></div><div class="small" id="progressText" style="margin-top:7px">3개 도형을 성공하면 공식이 열립니다.</div></div>
      <div class="card"><strong>내각의 합 계산</strong><div class="small" style="margin-top:5px">모두 자른 뒤, 삼각형 수 × 180°</div><div class="answer"><input id="answer" type="number" inputmode="numeric" placeholder="정답 입력"><button id="checkBtn">확인</button></div></div>
      <div class="card"><strong>공식</strong><div class="formula" id="formula" style="margin-top:8px">🔒 ???</div></div>
      <div class="card"><strong>난이도</strong><div class="levelBtns" style="margin-top:8px"><button data-level="1" class="active">훈련</button><button data-level="2">러시</button><button data-level="3">보스</button></div><div class="small" id="levelDesc" style="margin-top:7px">사각형~육각형 · 천천히 낙하</div></div>
      <button class="ghost" id="resetBtn">새 도형</button>
    </aside>
  </div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('gameWrap');
const $=id=>document.getElementById(id); const ui={score:$('score'),combo:$('combo'),polyName:$('polyName'),triNeed:$('triNeed'),sliceVal:$('sliceVal'),triRow:$('triRow'),bar:$('bar'),progressText:$('progressText'),answer:$('answer'),formula:$('formula'),levelDesc:$('levelDesc'),triHud:$('triHud'),mission:$('mission'),toast:$('toast')};
let W=0,H=0,dpr=1,level=1,score=0,combo=0,successes=0,formulaUnlocked=false;
let n=5,baseVerts=[],anchor=0,targets=[],cutTargets=new Set(),fallY=-180,speed=38,lastT=performance.now(),roundState='falling',pauseUntil=0;
let pointerDown=false,dragStart=null,dragNow=null,flashCuts=[],sparks=[],piecePops=[];
const rand=(a,b)=>Math.random()*(b-a)+a;
function resize(){const r=wrap.getBoundingClientRect();W=Math.floor(r.width);H=Math.floor(r.height);dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);makeShape();}
window.addEventListener('resize',resize);
function levelRange(){return level===1?[4,6]:level===2?[4,10]:[8,12]}
function makeShape(){const R=Math.min(W,H)*(.18+(n<=6?.03:0));baseVerts=[];const rot=-Math.PI/2+(n%2===0?Math.PI/n:0);for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n;baseVerts.push({x:W*.5+Math.cos(a)*R,y:Math.cos(0)+Math.sin(a)*R});}}
function worldVerts(){return baseVerts.map(v=>({x:v.x,y:v.y+fallY}))}
function newRound(){const [a,b]=levelRange();n=Math.floor(rand(a,b+1));anchor=Math.floor(Math.random()*n);cutTargets.clear();targets=[];for(let k=2;k<=n-2;k++)targets.push((anchor+k)%n);fallY=-Math.min(W,H)*.15;speed=level===1?34:level===2?48:60;roundState='falling';ui.answer.value='';makeShape();updateUI();showToast(n+'각형 등장!');}
function groundY(){return H-42}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#a9ddff');g.addColorStop(.72,'#eaf7ff');g.addColorStop(1,'#f7fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.28;ctx.fillStyle='#fff';for(let i=0;i<8;i++){const x=(i*137+40)%Math.max(W,1),y=55+(i%3)*70;ctx.beginPath();ctx.arc(x,y,25,0,Math.PI*2);ctx.arc(x+25,y+5,32,0,Math.PI*2);ctx.arc(x+55,y,22,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.fillStyle='#b8d99a';ctx.fillRect(0,groundY(),W,H-groundY());ctx.strokeStyle='#78975e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,groundY());ctx.lineTo(W,groundY());ctx.stroke();}
function polygonPath(vs){ctx.beginPath();vs.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()}
function drawPolygon(vs){ctx.save();const grd=ctx.createLinearGradient(0,fallY-80,W,fallY+100);grd.addColorStop(0,'#789cff');grd.addColorStop(1,'#9a7cf7');polygonPath(vs);ctx.fillStyle=grd;ctx.fill();ctx.strokeStyle='#4258ad';ctx.lineWidth=4;ctx.stroke();
// completed fan triangles subtly show learned decomposition
const a=vs[anchor];for(const t of cutTargets){const prev=(t-1+n)%n;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(vs[prev].x,vs[prev].y);ctx.lineTo(vs[t].x,vs[t].y);ctx.closePath();ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill();}
for(const t of cutTargets){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(vs[t].x,vs[t].y);ctx.strokeStyle='rgba(255,255,255,.96)';ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle='rgba(28,43,91,.6)';ctx.lineWidth=2;ctx.stroke();}
vs.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,i===anchor?11:5.5,0,Math.PI*2);ctx.fillStyle=i===anchor?'#ffe45c':'#fff';ctx.fill();ctx.strokeStyle=i===anchor?'#8c7100':'#4258ad';ctx.lineWidth=i===anchor?3:2;ctx.stroke();});ctx.restore();}
function drawSwipe(){if(!pointerDown||!dragStart||!dragNow)return;ctx.save();ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(dragStart.x,dragStart.y);ctx.lineTo(dragNow.x,dragNow.y);ctx.stroke();ctx.strokeStyle='rgba(83,105,255,.65)';ctx.lineWidth=3;ctx.stroke();ctx.restore();}
function drawFX(now){flashCuts=flashCuts.filter(f=>now-f.t<260);for(const f of flashCuts){const p=(now-f.t)/260;ctx.save();ctx.globalAlpha=1-p;ctx.strokeStyle='#fff';ctx.lineWidth=14*(1-p)+2;ctx.beginPath();ctx.moveTo(f.a.x,f.a.y);ctx.lineTo(f.b.x,f.b.y);ctx.stroke();ctx.restore();}
sparks=sparks.filter(s=>now-s.t<450);for(const s of sparks){const p=(now-s.t)/450;ctx.globalAlpha=1-p;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x+s.vx*p*34,s.y+s.vy*p*34,2.6,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
piecePops=piecePops.filter(q=>now-q.t<320);for(const q of piecePops){const p=(now-q.t)/320;ctx.save();ctx.globalAlpha=(1-p)*.65;ctx.translate(q.x+q.nx*Math.sin(p*Math.PI)*14,q.y+q.ny*Math.sin(p*Math.PI)*14);ctx.rotate(q.r*Math.sin(p*Math.PI));ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(13,0);ctx.lineTo(-8,10);ctx.closePath();ctx.fill();ctx.restore();}}
function animate(now){const dt=Math.min((now-lastT)/1000,.05);lastT=now;if(roundState==='falling'){fallY+=speed*dt;const vs=worldVerts();const bottom=Math.max(...vs.map(v=>v.y));if(bottom>=groundY()){roundState='miss';combo=0;updateUI();showToast('💥 MISS! 바닥에 닿았어요');pauseUntil=now+900;}}else if((roundState==='miss'||roundState==='won')&&now>pauseUntil&&roundState!=='quiz'){if(roundState==='miss')newRound();}
ctx.clearRect(0,0,W,H);drawSky();drawPolygon(worldVerts());drawSwipe();drawFX(now);requestAnimationFrame(animate);}
function posFromEvent(e){const r=canvas.getBoundingClientRect();const p=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);return{x:p.clientX-r.left,y:p.clientY-r.top}}
function pointerStart(e){if(roundState!=='falling')return;e.preventDefault();const p=posFromEvent(e),a=worldVerts()[anchor];if(Math.hypot(p.x-a.x,p.y-a.y)>54){showToast('노란 꼭짓점에서 시작!');return;}pointerDown=true;dragStart={...a};dragNow=p;}
function pointerMove(e){if(!pointerDown)return;e.preventDefault();dragNow=posFromEvent(e)}
function angularDiff(ax,ay,bx,by){const A=Math.atan2(ay,ax),B=Math.atan2(by,bx);let d=Math.abs(A-B);return Math.min(d,Math.PI*2-d)}
function pointerEnd(e){if(!pointerDown)return;e.preventDefault();const end=posFromEvent(e);pointerDown=false;const vs=worldVerts(),a=vs[anchor],sv={x:end.x-a.x,y:end.y-a.y},len=Math.hypot(sv.x,sv.y);if(len<48){showToast('조금 더 길게 쓱!');return;}
let best=null;for(const t of targets){if(cutTargets.has(t))continue;const tv={x:vs[t].x-a.x,y:vs[t].y-a.y};const ang=angularDiff(sv.x,sv.y,tv.x,tv.y);const forward=(sv.x*tv.x+sv.y*tv.y)>0;if(forward&&(!best||ang<best.ang))best={t,ang};}
if(!best||best.ang>0.38){combo=0;updateUI();showToast('대각선 방향으로 베어 보세요!');return;}cutTargets.add(best.t);const b=vs[best.t],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;flashCuts.push({a:{...a},b:{...b},t:performance.now()});for(let i=0;i<14;i++)sparks.push({x:mx,y:my,vx:rand(-1,1),vy:rand(-1,1),t:performance.now()});const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;piecePops.push({x:mx,y:my,nx:-dy/L,ny:dx/L,r:rand(-.35,.35),t:performance.now()});combo++;score+=120+combo*15;showToast('✂️ SLICE! 삼각형 +1');if(cutTargets.size>=n-3){roundState='quiz';score+=250;showToast('✨ PERFECT! '+(n-2)+'개의 삼각형');ui.mission.textContent='이제 삼각형 수 × 180°를 계산!';}updateUI();}
canvas.addEventListener('pointerdown',pointerStart);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',()=>pointerDown=false);
function checkAnswer(){if(roundState!=='quiz'){showToast('먼저 바닥 전에 모두 잘라 주세요!');return;}const val=Number(ui.answer.value),correct=(n-2)*180;if(val===correct){successes++;score+=350;combo++;if(successes>=3){formulaUnlocked=true;ui.formula.textContent='(n - 2) × 180°';ui.progressText.textContent='공식 잠금 해제 완료!';}showToast('🎉 정답! '+correct+'°');roundState='won';pauseUntil=performance.now()+950;updateUI();setTimeout(newRound,980);}else{combo=0;updateUI();showToast('삼각형 '+(n-2)+'개 × 180°를 계산해 봐요');}}
$('checkBtn').addEventListener('click',checkAnswer);ui.answer.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer()});$('resetBtn').addEventListener('click',newRound);
document.querySelectorAll('[data-level]').forEach(b=>b.addEventListener('click',()=>{level=Number(b.dataset.level);document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));ui.levelDesc.textContent=level===1?'사각형~육각형 · 천천히 낙하':level===2?'사각형~십각형 · 빠른 낙하':'팔각형~십이각형 · 가장 빠른 낙하';newRound();}));
function updateUI(){ui.score.textContent=score;ui.combo.textContent=combo;ui.polyName.textContent=n+'각형';ui.triNeed.textContent=(n-2)+'개';ui.sliceVal.textContent=cutTargets.size+' / '+(n-3);ui.triHud.textContent=Math.min(cutTargets.size+1,n-2)+' / '+(n-2);ui.bar.style.width=Math.min(successes/3*100,100)+'%';if(!formulaUnlocked)ui.formula.textContent='🔒 ???';ui.triRow.innerHTML='';for(let i=0;i<n-2;i++){const d=document.createElement('i');d.className='triDot'+(i<cutTargets.size+1?' on':'');ui.triRow.appendChild(d);}if(roundState==='falling')ui.mission.textContent='노란 꼭짓점에서 대각선 방향으로 쓱!';}
function showToast(msg){ui.toast.textContent=msg;ui.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>ui.toast.classList.remove('show'),850)}
resize();newRound();requestAnimationFrame(animate);
</script>
</body>
</html>
